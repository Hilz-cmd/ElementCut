<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElementCut</title>
    <meta name="description" content="Fast desktop video editor for vertical shorts with multi-track magnetic timeline, keyframing, and MP4 export." />
    <meta property="og:title" content="ElementCut" />
    <meta property="og:description" content="Fast desktop video editor for vertical shorts with multi-track magnetic timeline, keyframing, and MP4 export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Trailing slash normalization for GitHub Pages relative asset paths -->
    <script>
      (function() {
        var p = window.location.pathname;
        if (window.location.hostname.endsWith('github.io') && p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- Global error trap to reveal exact cause if deployment scripts fail -->
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        var errBox = document.getElementById('debug-error-box');
        if (errBox && (!root || root.children.length === 0 || root.querySelector('#loading-indicator'))) {
          errBox.style.display = 'block';
          errBox.textContent = 'Startup error: ' + (e.message || e.filename || 'Script failed to load.');
        }
      });
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-lyFl7iLM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cl8DI2xM.css">
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-blue-600 selection:text-white overflow-hidden select-none">
    <div id="root">
      <div id="loading-indicator" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#0a0a0c;color:#e5e5e5;font-family:system-ui,sans-serif;text-align:center;padding:20px;">
        <div style="width:36px;height:36px;border:3px solid #2563eb;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;"></div>
        <div style="font-size:16px;font-weight:600;letter-spacing:-0.02em;">Loading ElementCut...</div>
        <div id="debug-error-box" style="display:none;margin-top:16px;padding:12px 16px;background:#ef444420;border:1px solid #ef444450;border-radius:8px;color:#fca5a5;font-size:12px;font-family:monospace;max-width:500px;word-break:break-word;"></div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
  </body>
</html>
